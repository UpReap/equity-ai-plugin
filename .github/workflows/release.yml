name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the plugin version matches the tag
        run: |
          v=$(jq -r .version .claude-plugin/plugin.json)
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "plugin.json says $v, tag is ${GITHUB_REF_NAME}"; exit 1; }
          jq empty prompts/prompts.json
      - name: Build the files
        run: |
          mkdir dist
          (cd skills && zip -r ../dist/upreap-equity-analyst.zip upreap-equity-analyst)
          cp prompts/prompts.json dist/prompts.json
          zip -r dist/upreap-equity-plugin.zip .claude-plugin .mcp.json skills README.md LICENSE
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --generate-notes
